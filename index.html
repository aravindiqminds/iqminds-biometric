<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQMINDS - Staff Attendance Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 p-8 text-center">
    <h1 class="text-2xl font-bold text-white tracking-wide">IQMINDS Attendance</h1>
    <p class="text-xs text-slate-400 mb-6">Staff Biometric Verification</p>

    <!-- Staff Select -->
    <div class="mb-5 text-left">
      <label class="block text-xs font-semibold text-slate-300 mb-1">Staff Member Select Cheyandi</label>
      <select id="staffSelect" class="w-full px-3 py-2.5 bg-slate-700 text-white border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
        <option value="">-- Staff Name Select Cheyandi --</option>
      </select>
    </div>

    <!-- Photo Display -->
    <div class="relative w-40 h-40 mx-auto mb-5">
      <div id="placeholderImg" class="w-full h-full rounded-full bg-slate-700 border-4 border-slate-600 flex items-center justify-center text-4xl text-slate-400">
        👤
      </div>
      <img id="staffPhoto" class="w-full h-full rounded-full object-cover border-4 border-emerald-500 shadow-lg hidden" alt="Staff Profile">
    </div>

    <h2 id="staffName" class="text-lg font-bold text-white tracking-wide">System Ready</h2>
    <p id="platformInfo" class="text-slate-400 text-xs mt-1 mb-4">Device Check...</p>

    <div id="statusBox" class="py-2.5 px-4 rounded-xl bg-slate-700/50 border border-slate-600 text-slate-300 text-xs font-medium mb-6">
      Name select chesi Thumb pettandi
    </div>

    <!-- Universal Scan Button -->
    <button id="punchBtn" type="button" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl shadow-lg transition active:scale-95 text-base">
      👉 Scan Thumb & Punch
    </button>

    <div class="mt-6 text-xs text-slate-500">
      Kotha Staff Registration: <a href="/register.html" class="text-indigo-400 underline hover:text-indigo-300">Register Ikkada</a>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let staffMap = {};
    const isAndroid = /Android/i.test(navigator.userAgent);
    document.getElementById("platformInfo").innerText = isAndroid 
      ? "📱 Android Mode (OTG MFS110 RD App)" 
      : "💻 Windows Mode (Local RD Port)";

    // Load Staff List
    async function loadStaffList() {
      try {
        const querySnapshot = await getDocs(collection(db, "staff"));
        const select = document.getElementById("staffSelect");
        querySnapshot.forEach((doc) => {
          const s = doc.data();
          staffMap[s.id] = s;
          const opt = document.createElement("option");
          opt.value = s.id;
          opt.innerText = `${s.name} (${s.id})`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error("Staff list error:", err);
      }
    }
    loadStaffList();

    // Mark Attendance in Firestore
    async function recordPunch(staff) {
      document.getElementById("placeholderImg").classList.add("hidden");
      const img = document.getElementById("staffPhoto");
      img.src = staff.photoUrl;
      img.classList.remove("hidden");

      document.getElementById("staffName").innerText = staff.name;

      const now = new Date();
      const timeString = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

      await addDoc(collection(db, "attendance_logs"), {
        staffId: staff.id,
        name: staff.name,
        timestamp: now.toISOString(),
        time: timeString,
        date: now.toISOString().split("T")[0]
      });

      const statusBox = document.getElementById("statusBox");
      statusBox.className = "py-2.5 px-4 rounded-xl bg-emerald-950/60 border border-emerald-600 text-emerald-300 text-xs font-semibold mb-6";
      statusBox.innerText = `✅ Attendance Marked: ${timeString}`;
    }

    // Windows Local Port Detect
    async function getWindowsPort() {
      const ports = [11100, 11101, 11102, 11103, 11104, 11105];
      for (const port of ports) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 600);
          const res = await fetch(`https://127.0.0.1:${port}/`, { method: "RDSERVICE", signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok || res.status === 200) return port;
        } catch (e) {}
      }
      return 11100;
    }

    // Punch Button Click Handler
    document.getElementById("punchBtn").addEventListener("click", async () => {
      const selectedId = document.getElementById("staffSelect").value;
      if (!selectedId) {
        alert("Dayachesi mundhuga Staff Name select cheyandi!");
        return;
      }

      const statusBox = document.getElementById("statusBox");
      statusBox.innerText = "Scanning... MFS110 meeda finger pettandi";
      statusBox.className = "py-2.5 px-4 rounded-xl bg-amber-950/60 border border-amber-600 text-amber-300 text-xs font-medium mb-6";

      const pidOpts = `<PidOptions ver="1.0"><Opts fCount="1" fType="2" iCount="0" pCount="0" format="0" pidVer="2.0" timeout="10000" posh="UNKNOWN" env="P" /></PidOptions>`;

      if (isAndroid) {
        // Android OTG direct launch via Mantra RD Service Package
        localStorage.setItem("iq_punch_staff_id", selectedId);
        const encodedOpts = encodeURIComponent(pidOpts);
        const intentUri = `intent:#Intent;action=in.gov.uidai.rdservice.fp.CAPTURE;type=text/xml;S.PID_OPTIONS=${encodedOpts};package=com.mantra.mfs110.rdservice;end`;
        window.location.href = intentUri;
        return;
      }

      // Windows Local Port Flow
      try {
        const port = await getWindowsPort();
        const res = await fetch(`https://127.0.0.1:${port}/rd/capture`, {
          method: "CAPTURE",
          headers: { "Content-Type": "text/xml" },
          body: pidOpts
        });

        const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
        const respNode = xml.getElementsByTagName("Resp")[0];

        if (respNode && respNode.getAttribute("errCode") === "0") {
          recordPunch(staffMap[selectedId]);
        } else {
          statusBox.className = "py-2.5 px-4 rounded-xl bg-red-950/60 border border-red-600 text-red-300 text-xs font-semibold mb-6";
          statusBox.innerText = "Scan fail aindi: " + (respNode ? respNode.getAttribute("errInfo") : "Device Error");
        }
      } catch (err) {
        statusBox.className = "py-2.5 px-4 rounded-xl bg-red-950/60 border border-red-600 text-red-300 text-xs font-semibold mb-6";
        statusBox.innerText = "Mantra RD Service Connect Kaaledhu!";
      }
    });

    // Android App nunchi browser loki return ayyaka automatic ga mark avvadam
    window.addEventListener("pageshow", () => {
      const pendingId = localStorage.getItem("iq_punch_staff_id");
      if (pendingId && isAndroid) {
        localStorage.removeItem("iq_punch_staff_id");
        if (staffMap[pendingId]) {
          recordPunch(staffMap[pendingId]);
        }
      }
    });
  </script>
</body>
</html>
