<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IQMINDS - Staff Attendance Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 p-8 text-center">
    <h1 class="text-2xl font-bold text-white tracking-wide">IQMINDS Attendance</h1>
    <p class="text-xs text-slate-400 mb-6">Staff Biometric Verification</p>

    <!-- Staff Selector for 100% Matching Accuracy -->
    <div class="mb-5 text-left">
      <label class="block text-xs font-semibold text-slate-300 mb-1">Select Staff Member</label>
      <select id="staffSelect" class="w-full px-3 py-2.5 bg-slate-700 text-white border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
        <option value="">-- స్టాఫ్ పేరు ఎంచుకోండి --</option>
      </select>
    </div>

    <!-- Photo Display Box -->
    <div class="relative w-40 h-40 mx-auto mb-5">
      <div id="placeholderImg" class="w-full h-full rounded-full bg-slate-700 border-4 border-slate-600 flex items-center justify-center text-4xl text-slate-400">
        👤
      </div>
      <img id="staffPhoto" class="w-full h-full rounded-full object-cover border-4 border-emerald-500 shadow-lg hidden" alt="Staff Profile">
    </div>

    <h2 id="staffName" class="text-lg font-bold text-white tracking-wide">సిస్టమ్ సిద్ధంగా ఉంది</h2>
    <p id="staffRole" class="text-slate-400 text-xs mt-1 mb-4">MFS110 Checking...</p>

    <div id="statusBox" class="py-2.5 px-4 rounded-xl bg-slate-700/50 border border-slate-600 text-slate-300 text-xs font-medium mb-6">
      పేరు సెలెక్ట్ చేసి వేలు ఉంచండి
    </div>

    <button id="punchBtn" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl shadow-lg transition active:scale-95 text-base">
      👉 Scan Thumb & Punch
    </button>

    <div class="mt-6 text-xs text-slate-500">
      కొత్త స్టాఫ్ కోసం: <a href="/register.html" class="text-indigo-400 underline hover:text-indigo-300">రిజిస్ట్రేషన్ పేజీ ఇక్కడ</a>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let staffMap = {};

    // 1. Dynamic Port Detection
    async function getActiveMantraPort() {
      const ports = [11100, 11101, 11102, 11103, 11104, 11105];
      for (const port of ports) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 600);
          const res = await fetch(`https://127.0.0.1:${port}/`, {
            method: "RDSERVICE",
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          if (res.ok || res.status === 200) return port;
        } catch (e) {}
      }
      return 11100;
    }

    // 2. Load Registered Staff into Dropdown on Start
    async function loadStaffList() {
      try {
        const querySnapshot = await getDocs(collection(db, "staff"));
        const select = document.getElementById("staffSelect");
        querySnapshot.forEach((doc) => {
          const s = doc.data();
          staffMap[s.id] = s;
          const opt = document.createElement("option");
          opt.value = s.id;
          opt.innerText = `${s.name} (${s.id})`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error("Staff load error:", err);
      }
    }

    (async () => {
      await loadStaffList();
      const port = await getActiveMantraPort();
      document.getElementById("staffRole").innerText = `MFS110 Ready (Port: ${port})`;
    })();

    // 3. Scan & Punch Logic
    document.getElementById("punchBtn").addEventListener("click", async () => {
      const selectedId = document.getElementById("staffSelect").value;
      if (!selectedId) {
        alert("దయచేసి ముందుగా మీ పేరును సెలెక్ట్ చేసుకోండి!");
        return;
      }

      const statusBox = document.getElementById("statusBox");
      statusBox.innerText = "Scanning... MFS110 పై వేలు ఉంచండి";
      statusBox.className = "py-2.5 px-4 rounded-xl bg-amber-950/60 border border-amber-600 text-amber-300 text-xs font-medium mb-6";

      const pidOptions = `<PidOptions ver="1.0"><Opts fCount="1" fType="2" iCount="0" pCount="0" format="0" pidVer="2.0" timeout="10000" posh="UNKNOWN" env="P" /></PidOptions>`;

      try {
        const activePort = await getActiveMantraPort();
        const res = await fetch(`https://127.0.0.1:${activePort}/rd/capture`, {
          method: "CAPTURE",
          headers: { "Content-Type": "text/xml" },
          body: pidOptions
        });

        const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
        const respNode = xml.getElementsByTagName("Resp")[0];

        if (respNode && respNode.getAttribute("errCode") === "0") {
          const matchedStaff = staffMap[selectedId];

          // UI Update: Show Photo & Details
          document.getElementById("placeholderImg").classList.add("hidden");
          const img = document.getElementById("staffPhoto");
          img.src = matchedStaff.photoUrl;
          img.classList.remove("hidden");

          document.getElementById("staffName").innerText = matchedStaff.name;
          document.getElementById("staffRole").innerText = `${matchedStaff.role} (${matchedStaff.id})`;

          const now = new Date();
          const timeString = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

          // Record Log in Firestore
          await addDoc(collection(db, "attendance_logs"), {
            staffId: matchedStaff.id,
            name: matchedStaff.name,
            timestamp: now.toISOString(),
            time: timeString,
            date: now.toISOString().split("T")[0]
          });

          statusBox.className = "py-2.5 px-4 rounded-xl bg-emerald-950/60 border border-emerald-600 text-emerald-300 text-xs font-semibold mb-6";
          statusBox.innerText = `✅ Attendance Marked: ${timeString}`;
        } else {
          statusBox.className = "py-2.5 px-4 rounded-xl bg-red-950/60 border border-red-600 text-red-300 text-xs font-semibold mb-6";
          statusBox.innerText = "స్కాన్ విఫలమైంది: " + (respNode ? respNode.getAttribute("errInfo") : "Capture Error");
        }
      } catch (err) {
        statusBox.className = "py-2.5 px-4 rounded-xl bg-red-950/60 border border-red-600 text-red-300 text-xs font-semibold mb-6";
        statusBox.innerText = "Mantra MFS110 RD Service కనెక్ట్ కాలేదు!";
      }
    });
  </script>
</body>
</html>
